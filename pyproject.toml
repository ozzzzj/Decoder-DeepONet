[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddon-efish"
version = "0.1.0"
description = "Lightweight local inference package for Decoder-DeepONet (DDON) EFISH electric-field reconstruction."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy<3",
  "onnxruntime>=1.17",
  "scipy>=1.9"
]

[project.scripts]
ddon = "ddon.cli:main"

[tool.setuptools.packages.find]
include = ["ddon*"]
