name: Build DDON Local Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout api branch
        uses: actions/checkout@v4
        with:
          ref: api

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DDON-Local-Package
          path: dist/*
          if-no-files-found: error
