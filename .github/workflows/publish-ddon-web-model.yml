name: Publish DDON Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Model version, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      make_stable:
        description: "Also update DDON-WEB latest stable model"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Version must use semantic versioning, e.g. v1.0.0"
            exit 1
          }

      - name: Checkout api branch
        uses: actions/checkout@v4
        with:
          ref: api

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install conversion dependencies
        run: pip install -r requirements-onnx.txt

      - name: Convert and verify DDON
        run: python tools/convert_ddon_to_onnx.py

      - name: Download TensorFlow model for versioned release
        run: |
          curl -L --fail --retry 3 \
            https://github.com/ozzzzj/Decoder-DeepONet/releases/download/DDON/20260520_model_Batsize-512.h5 \
            -o model/DDON.h5

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "DDON-$VERSION" >/dev/null 2>&1; then
            echo "Release DDON-$VERSION already exists. Refusing to overwrite a reproducible version."
            exit 1
          fi
          gh release create "DDON-$VERSION" \
            --title "DDON $VERSION" \
            --notes "Versioned DDON release. The ONNX model was numerically verified against the TensorFlow model during conversion." \
            model/DDON.h5#DDON-$VERSION.h5 \
            model/DDON.onnx#DDON-$VERSION.onnx

      - name: Update latest stable web model
        if: ${{ inputs.make_stable }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release view DDON-WEB >/dev/null 2>&1 || \
            gh release create DDON-WEB --title "DDON Web Model" --notes "Latest stable DDON model for browser and lightweight local inference."
          gh release upload DDON-WEB model/DDON.onnx --clobber
          gh release edit DDON-WEB --notes "Latest stable DDON model for browser and lightweight local inference. Current stable version: $VERSION."
