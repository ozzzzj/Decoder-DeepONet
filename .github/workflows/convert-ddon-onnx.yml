name: Convert DDON to ONNX

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout api branch
        uses: actions/checkout@v4
        with:
          ref: api

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-onnx.txt

      - name: Convert and verify
        run: python tools/convert_ddon_to_onnx.py

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDON-ONNX
          path: model/DDON.onnx
          if-no-files-found: error
